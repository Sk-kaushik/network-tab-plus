<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>Network Tab+</title>
<link rel="stylesheet" href="lib/tabulator.min.css" />
<link rel="stylesheet" href="panel.css" />
</head>
<body>

<div class="panel">

  <!-- row 1: actions, search, utilities. Wraps instead of clipping. -->
  <div class="bar">
    <button class="ib" id="recBtn" title="Pause recording"><span class="rec"></span></button>
    <button class="ib" id="clearBtn" title="Clear">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 4h11M6 4V2.6h4V4M4 4l.6 9.4h6.8L12 4"/><path d="M6.6 6.4v5M9.4 6.4v5"/></svg>
    </button>
    <div class="sep"></div>
    <label class="tog"><input type="checkbox" id="preserveLog" />Preserve log</label>
    <div class="sep"></div>
    <div class="find">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.3"/><path d="M10.2 10.2 14 14"/></svg>
      <input id="query" placeholder="Filter" spellcheck="false"
             title="Plain text matches the URL. -word excludes. /regex/ for patterns." />
      <span class="clr" id="queryClear" title="Clear">✕</span>
    </div>

    <div class="wrap">
      <button class="btn" id="moreBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 4.5h11M4.5 8h7M6.5 11.5h3"/></svg>
        More filters <span class="car">▼</span>
      </button>
      <div class="pop" id="morePop">
        <div class="pop-t">Show filter rows</div>
        <label class="prow"><input type="checkbox" data-row="method" /><span class="nm">Method</span><span class="cnt" id="cntMethod"></span></label>
        <label class="prow"><input type="checkbox" data-row="status" /><span class="nm">Status</span><span class="cnt" id="cntStatus"></span></label>
        <label class="prow"><input type="checkbox" data-row="type" /><span class="nm">Type</span><span class="cnt" id="cntType"></span></label>
        <hr class="pdiv" />
        <label class="prow"><input type="checkbox" data-opt="hideData" /><span class="nm">Hide data: URLs</span></label>
        <label class="prow"><input type="checkbox" data-opt="thirdParty" /><span class="nm">Third-party only</span></label>
      </div>
    </div>

    <div class="wrap">
      <button class="btn" id="colsBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.4"/><path d="M6.2 2.8v10.4M10.2 2.8v10.4"/></svg>
        Columns
      </button>
      <div class="pop" id="colsMenu">
        <div class="pop-t">Show columns</div>
        <div id="colList"></div>
        <hr class="pdiv" />
        <div class="pop-foot"><button id="colReset">Reset to default</button></div>
      </div>
    </div>

    <button class="btn" id="hiddenBtn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 8s2.4-4 6-4 6 4 6 4-2.4 4-6 4-6-4-6-4Z"/><path d="M3 3l10 10"/></svg>
      Hidden <span class="badge" id="hiddenCount">0</span>
    </button>
  </div>

  <!-- row 2: resource types (Chrome's own set) and saved filters -->
  <div class="fb" id="typeRow">
    <div class="chips" id="typeChips"></div>
    <div class="views" id="views"></div>
  </div>

  <!-- row 3: method and status, shown only when ticked in More filters -->
  <div class="xb" id="extraRow" hidden>
    <span class="lbl" id="methodLabel">Method</span>
    <div class="grp" id="methodChips"></div>
    <div class="vdiv" id="chipDivider"></div>
    <span class="lbl" id="statusLabel">Status</span>
    <div class="grp" id="statusChips"></div>
  </div>

  <!-- table + detail -->
  <div class="split" id="split">
    <div class="tw" id="table"></div>

    <div class="dp" id="detail" hidden>
      <div class="grip" id="grip"></div>
      <div class="dt">
        <button class="tb on" data-tab="headers">Headers</button>
        <button class="tb" data-tab="payload">Payload</button>
        <button class="tb" data-tab="response">Response</button>
        <button class="exp" id="expBtn">
          <svg id="expIcon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9"/></svg>
          <span id="expLabel">Expand</span>
        </button>
        <button class="ib" id="closeDetail" title="Close">✕</button>
      </div>
      <div class="db" id="detailBody"></div>
    </div>
  </div>

  <div class="sb">
    <span><b id="statCount">0</b> requests</span>
    <span><b id="statBytes">0 B</b> transferred</span>
    <span class="hid" id="statHidden" hidden></span>
  </div>

  <div class="scrim" id="scrim"></div>

  <div class="drw" id="drawer">
    <div class="drw-h">
      Hidden requests
      <span class="grow"></span>
      <button class="ib" id="unhideAll">Un-hide all</button>
      <button class="ib" id="closeDrawer">✕</button>
    </div>
    <div class="drw-b" id="rulesList"></div>
    <div class="drw-f" id="rulesFoot"></div>
  </div>
</div>

<!-- one context menu, no submenus -->
<div class="ctx" id="rowMenu">
  <div class="ctx-head"><span class="m" id="ctxMethod"></span><span class="u" id="ctxUrl"></span></div>

  <div class="ctx-grp">Hide</div>
  <div class="mi" data-act="hide-once">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 8h8"/></svg>
    This request only<span class="hint">1 row</span>
  </div>
  <div class="mi" data-act="hide-path">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 8s2.4-4 6-4 6 4 6 4-2.4 4-6 4-6-4-6-4Z"/><path d="M3 3l10 10"/></svg>
    All with this path<span class="hint" id="ctxPath"></span>
  </div>
  <div class="mi" data-act="hide-domain">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.6"/><path d="M2.6 8h10.8M8 2.4c1.5 1.6 2.2 3.5 2.2 5.6S9.5 11.9 8 13.6C6.5 11.9 5.8 10.1 5.8 8S6.5 4 8 2.4Z"/></svg>
    All from this domain<span class="hint" id="ctxHost"></span>
  </div>
  <label class="scope"><input type="checkbox" id="ctxGlobal" />Apply on every site, not just this one</label>

  <hr class="pdiv" />
  <div class="ctx-grp">Copy</div>
  <div class="mi" data-act="copy-url"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l2-2a2.6 2.6 0 0 0-3.7-3.7l-.6.6"/><path d="M9.4 6.6a2.6 2.6 0 0 0-3.7 0l-2 2a2.6 2.6 0 0 0 3.7 3.7l.6-.6"/></svg>Copy URL</div>
  <div class="mi" data-act="copy-curl"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 5.5 6 8l-3 2.5M7.5 11h5.5"/></svg>Copy as cURL</div>
  <div class="mi gql-only" data-act="copy-query"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 2.2 13.2 5.1v5.8L8 13.8 2.8 10.9V5.1z"/><circle cx="8" cy="8" r="1.6"/></svg>Copy GraphQL query</div>
  <div class="mi gql-only" data-act="copy-variables"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5.5 2.5C4 2.5 3.4 3.4 3.4 5v1.3c0 .9-.4 1.4-1.4 1.7 1 .3 1.4.8 1.4 1.7V11c0 1.6.6 2.5 2.1 2.5M10.5 2.5c1.5 0 2.1.9 2.1 2.5v1.3c0 .9.4 1.4 1.4 1.7-1 .3-1.4.8-1.4 1.7V11c0 1.6-.6 2.5-2.1 2.5"/></svg>Copy GraphQL variables</div>
  <div class="mi" data-act="copy-payload"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 2.5 13 5v6l-5 2.5L3 11V5z"/></svg>Copy payload</div>
  <div class="mi" data-act="copy-response"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M3 3h7l3 3v7H3z"/><path d="M5.5 8h5M5.5 10.5h3.5"/></svg>Copy response</div>

  <hr class="pdiv" />
  <div class="mi" data-act="filter-domain"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2.5 3.5h11L9.4 8.3v4.2l-2.8 1.5V8.3z"/></svg>Filter to this domain</div>
</div>

<div class="ctx" id="headMenu">
  <div class="ctx-grp">Show columns</div>
  <div id="headColList"></div>
</div>

<div class="toast" id="toast"></div>

<script src="lib/tabulator.min.js"></script>
<script type="module" src="panel.js"></script>
</body>
</html>
